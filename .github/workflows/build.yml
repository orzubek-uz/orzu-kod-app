name: Build OrzuKod APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build OrzuKod Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build Web App
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save --legacy-peer-deps
          npm run build

      - name: Setup Capacitor Android
        run: |
          WEB_DIR="dist"
          if [ ! -d "dist" ] && [ -d "build" ]; then WEB_DIR="build"; fi
          rm -rf capacitor.config.json capacitor.config.ts android
          npx cap init "OrzuKod" "com.orzukod.code" --web-dir "$WEB_DIR"
          npx cap add android
          npx cap sync android

      - name: Inject Android Permissions and Cleartext Support
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <application android:usesCleartextTraffic="true"/g' "$MANIFEST"
          fi

      - name: Generate and Set App Logo
        run: |
          pip install pillow
          python3 - << 'EOF'
          import os, glob
          from PIL import Image, ImageDraw
          if not os.path.exists("logo.png"):
              img = Image.new("RGBA", (512, 512), (18, 24, 36, 255))
              draw = ImageDraw.Draw(img)
              draw.polygon([(290, 60), (140, 280), (250, 280), (210, 452), (372, 230), (260, 230)], fill=(255, 200, 0, 255))
              img.save("logo.png")
          img = Image.open("logo.png").convert("RGBA")
          for f in glob.glob("android/app/src/main/res/mipmap-*/ic_launcher*.png"):
              img.resize((192, 192)).save(f)
          EOF
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Prepare Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          mkdir -p ~/.android
          cp debug.keystore ~/.android/ || true
          cp debug.keystore android/ || true
          cp debug.keystore android/app/ || true

      - name: Build Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "OrzuKod v${{ github.run_number }}"
          files: "android/app/build/outputs/apk/debug/*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
